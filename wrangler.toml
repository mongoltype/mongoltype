# Cloudflare Configuration for MongolType
name = "mongoltype"
compatibility_date = "2024-09-01"
pages_build_output_dir = "dist"

[assets]
directory = "./dist"

[vars]
ENVIRONMENT = "production"
ENABLE_CDN_CACHE = "true"
CACHE_CONTROL_STATIC = "public, max-age=31536000, immutable"

[limits]
cpu_ms = 50
