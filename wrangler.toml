# Cloudflare Configuration for MongolType
name = "mongoltype"
compatibility_date = "2024-09-01"

[build]
command = "npm run build"

[assets]
directory = "./dist"

[vars]
ENVIRONMENT = "production"
ENABLE_CDN_CACHE = "true"
CACHE_CONTROL_STATIC = "public, max-age=31536000, immutable"

# Edge rules and limits
[limits]
cpu_ms = 50
